name: Deploy Frontend to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend bundle
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PLANNER_API_BASE_URL: ${{ vars.PLANNER_API_BASE_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_FRONTEND_DSN }}
          SENTRY_ENVIRONMENT: production
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_BROWSER_SCRIPT_URL: ${{ vars.SENTRY_BROWSER_SCRIPT_URL }}
          ADSENSE_CLIENT: ${{ vars.ADSENSE_CLIENT }}
          ADSENSE_ENABLED: ${{ vars.ADSENSE_ENABLED }}
        run: python scripts/build_frontend.py

      - name: Publish to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          directory: dist/frontend
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
