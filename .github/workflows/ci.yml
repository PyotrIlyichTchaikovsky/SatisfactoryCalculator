name: CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: satisfactory_calculator/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
      - name: Install locked release tools
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Python dependencies
        run: python -m pip install -r satisfactory_calculator/requirements.txt

      - name: Check Python syntax
        run: >
          python -m py_compile
          satisfactory_calculator/recipe_web/production_planner_core.py
          satisfactory_calculator/recipe_web/production_planner_server.py
          satisfactory_calculator/recipe_web/production_planner_app.py
          scripts/build_frontend.py

      - name: Run Python tests
        run: python -m unittest discover -s satisfactory_calculator/tests -v

      - name: Check frontend syntax
        run: |
          node --check satisfactory_calculator/recipe_web/production_planner.js
          node --check satisfactory_calculator/recipe_web/planner_analytics.js

      - name: Test frontend diagnostics
        run: node --test satisfactory_calculator/tests/planner_diagnostics.test.cjs
      - name: Test usage analytics
        run: pnpm test:analytics

      - name: Build frontend bundle
        run: python scripts/build_frontend.py

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser system tests against local production entrypoints
        run: pnpm test:e2e
      - name: Preserve failed browser evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
